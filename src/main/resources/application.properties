spring.application.name=springAi

# Activate local profile by default (loads application-local.properties if present)
spring.profiles.active=local

# Groq - Chat (OpenAI compatible endpoint)
# Fallback to GROQ_API_KEY environment variable if application-local.properties is not present
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b





